<!DOCTYPE html>
<html lang="bn">
<head>
  {{ partial "docs/html-head" . }}
  {{ partial "docs/inject/head" . }}
  <title>404 - পেজ পাওয়া যায়নি | AlgoBangla</title>
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--body-background);
      color: var(--body-font-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .not-found-container {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }

    .not-found-code {
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      margin: 0;
      opacity: 0.15;
      font-family: "Fira Code", "Source Code Pro", monospace;
    }

    .not-found-msg {
      font-size: 1.5rem;
      margin: 0.5rem 0 1.5rem;
    }

    .not-found-hint {
      color: var(--gray-500, #6b7280);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .not-found-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .not-found-links a {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .not-found-links a:hover {
      opacity: 0.85;
    }

    .not-found-links a.primary {
      background: var(--color-link, #0969da);
      color: #fff;
    }

    .not-found-links a.secondary {
      border: 1px solid var(--gray-300, #d1d5db);
      color: var(--body-font-color);
    }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="not-found-container">
      <p class="not-found-code">404</p>
      <p class="not-found-msg">পেজটি পাওয়া যায়নি</p>
      <p class="not-found-hint">তুমি যে পেজটি খুঁজছো সেটা সরানো হয়েছে, নাম পরিবর্তন করা হয়েছে, অথবা কখনো ছিল না।</p>
      <div class="not-found-links">
        <a href="/bn/" class="primary">বাংলা হোমপেজ</a>
        <a href="/en/" class="secondary">English Home</a>
      </div>
    </div>
  </div>
  {{ partial "docs/inject/body" . }}
</body>
</html>
