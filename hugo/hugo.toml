baseURL = "https://algobangla.web.app/"
title = "algobangla"
theme = "hugo-book"
enableGitInfo = true
defaultContentLanguage = "bn"
defaultContentLanguageInSubdir = true

[languages]
  [languages.bn]
    languageName = "বাংলা"
    contentDir = "content/bn"
    weight = 1
    [languages.bn.params]
      BookSection = "/"

  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 2
    [languages.bn.params]
      BookSection = "/"

# Hugo-book settings
[params]
  # Sidebar
  BookSection = "/"
  BookToC = true
  BookTheme = "light"  # base is light; dark toggled via html[data-theme="dark"] in theme-toggle.css
  BookSearch = true
  BookCollapseSection = true
  BookComments = false
  BookPortableLinks = false
  BookMenuBundle = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"], ["\\[", "\\]"]]
          inline = [["$", "$"], ["\\(", "\\)"]]

  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
