<script>
(function() {
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    localStorage.setItem('theme', theme);

    var button = document.getElementById('theme-toggle');
    if (button) {
      var isDark = theme === 'dark';
      button.setAttribute('aria-pressed', String(isDark));
      button.setAttribute('data-theme-state', theme);

      var label = button.querySelector('.theme-switch-label');
      if (label) {
        label.textContent = isDark ? 'Dark mode' : 'Light mode';
      }
    }

    var syntax = document.getElementById('syntax-css');
    if (syntax) {
      syntax.href = syntax.href.replace(
        theme === 'dark' ? 'syntax-light' : 'syntax-dark',
        theme === 'dark' ? 'syntax-dark' : 'syntax-light'
      );
    }
  }

  function initThemeToggle() {
    var button = document.getElementById('theme-toggle');
    if (!button) return;

    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');

    button.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initThemeToggle);
  } else {
    initThemeToggle();
  }
})();
</script>
